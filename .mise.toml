include = [
  "git::ssh://git@github.com/ckoliber/.github.git//default.toml?ref=main",
  "git::ssh://git@github.com/ckoliber/.github.git//docker.toml?ref=main",
]
task_config.includes = [
  "git::ssh://git@github.com/ckoliber/.github.git//tasks?ref=main",
]

[env]
DOCKER_PLATFORMS = "linux/amd64,linux/arm64,linux/arm/v7"

[tools]
go = "1.27.3"

[tasks."go:deps"]
run = "go mod download"

[tasks."go:test"]
run = "go test ./..."

[tasks."go:build"]
env = { CGO_ENABLED = "0", GOOS = "linux", GOARM = "7", GOFLAGS = "-trimpath -ldflags=-s" }
run = """
rm -rf dist && mkdir dist && cd dist
for arch in amd64 arm64 armv7; do
  name=rockchip-exporter-${VERSION:?}.linux-$arch
  GOARCH=${arch%v7} go build -o $name/ .. && cp ../README.md $name/
  tar -czf $name.tar.gz $name && rm -r $name
done
sha256sum *.tar.gz > sha256sums.txt
"""
