include = [
  "git::ssh://git@github.com/ckoliber/.github.git//default.toml?ref=main",
]
task_config.includes = [
  "git::ssh://git@github.com/ckoliber/.github.git//tasks?ref=main",
]

[env]
CGO_ENABLED = "0"
GOFLAGS = "-trimpath -ldflags=-s"
KO_DOCKER_REPO = "ghcr.io/ckoliber/rockchip-exporter"
KO_DEFAULTPLATFORMS = "linux/amd64,linux/arm64,linux/arm/v7"
KO_DEFAULTBASEIMAGE = "gcr.io/distroless/static-debian13"

[tools]
go = "1.27.3"
ko = "0.19.1"

[tasks."go:deps"]
run = "go mod download"

[tasks."go:test"]
run = "go test ./..."

[tasks."go:build"]
env = { GOOS = "linux", GOARM = "7" }
run = """
rm -rf dist && mkdir dist && cd dist
for arch in amd64 arm64 armv7; do
  name=rockchip-exporter-${VERSION:?}.linux-$arch
  GOARCH=${arch%v7} go build -o $name/ .. && cp ../*.md $name/
  tar -czf $name.tar.gz $name && rm -r $name
done
sha256sum *.tar.gz > sha256sums.txt
"""

[tasks."ko:login"]
run = 'gh auth token | ko login ghcr.io -u "${GITHUB_ACTOR:-$(gh api user --jq .login)}" --password-stdin'

[tasks."ko:build"]
run = "ko build --bare --tags ${VERSION:?} ."
